<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid-Atlantic MIMIC-TPW2</title>
    <style>
        :root { --bg: #0d0d0d; --accent: #00ffcc; }
        body { margin: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #e0e0e0; font-family: sans-serif; overflow: hidden; }
        h2 { margin: 0 0 5px 0; font-weight: 300; letter-spacing: 2px; font-size: 1.1rem; }
        .timestamp { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; font-family: monospace; }
        
        /* Viewport */
        .map-container {
            width: 95vw; height: 70vh; overflow: hidden; border: 1px solid #333;
            position: relative; background-color: #000;
        }

        #satellite-img {
            position: absolute;
            width: 380%; left: -215%; top: -115%;
            transition: opacity 0.5s;
        }

        /* Error Message */
        #error-msg {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; color: #ff6666;
        }

        /* Controls */
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button {
            background: #222; border: 1px solid #444; color: #aaa;
            padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 0.8rem;
        }
        button.active { border-color: var(--accent); color: var(--accent); background: #111; }
        
        .legend {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.8); padding: 5px; border-radius: 3px;
        }
    </style>
</head>
<body>

    <h2>MID-ATLANTIC PRECIPITABLE WATER</h2>
    <div id="status" class="timestamp">SYNCING...</div>
    
    <div class="map-container">
        <div id="error-msg">⚠️ Image failed to load.<br>The source server might be down or blocking the request.</div>
        <img id="satellite-img" 
             src="https://tropic.ssec.wisc.edu/real-time/mtpw2/webAnims/tpw_nrl_colors/conus/24hrs.gif" 
             onload="this.style.opacity=1; document.getElementById('error-msg').style.display='none';"
             onerror="document.getElementById('error-msg').style.display='block';">
        
        <div class="legend">
            <img src="https://tropic.ssec.wisc.edu/real-time/mtpw2/images/legends/tpw_nrl_colors.png" height="30">
        </div>
    </div>

    <div class="controls">
        <button id="btn-24" class="active" onclick="switchView('24hrs')">24 Hours</button>
        <button id="btn-72" onclick="switchView('72hrs')">72 Hours</button>
    </div>

    <script>
        const img = document.getElementById('satellite-img');
        
        function switchView(span) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + span.replace('hrs','')).classList.add('active');
            
            // Force refresh with HTTPS
            const timestamp = new Date().getTime();
            img.src = `https://tropic.ssec.wisc.edu/real-time/mtpw2/webAnims/tpw_nrl_colors/conus/${span}.gif?v=${timestamp}`;
            updateTime();
        }

        function updateTime() {
            document.getElementById('status').innerText = "UPDATED: " + new Date().toLocaleTimeString();
        }

        // Auto refresh every 10 mins
        setInterval(() => switchView(document.getElementById('btn-24').classList.contains('active') ? '24hrs' : '72hrs'), 600000);
        updateTime();
    </script>
</body>
</html>
