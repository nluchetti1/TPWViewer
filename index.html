<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SE US Satellite Monitor</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #00ffcc;
            font-family: sans-serif;
        }

        /* The 'Frame' around your map */
        .map-wrapper {
            width: 800px;  /* Width of the visible area */
            height: 600px; /* Height of the visible area */
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
        }

        /* The Iframe itself */
        #mimic-frame {
            position: absolute;
            
            /* These dimensions represent the FULL SSEC page */
            width: 1400px; 
            height: 1000px;

            /* SHIFTING THE MAP: This is where we center NC */
            /* left: moves the map left/right (-750px is a good start for East Coast) */
            /* top: moves the map up/down (-200px hides the header) */
            left: -760px; 
            top: -210px;
            
            border: none;
            transform: scale(1.4); /* Extra zoom for detail */
            transform-origin: 0 0;
        }

        .controls { margin-top: 15px; }
        button {
            background: #111; color: #00ffcc; border: 1px solid #00ffcc;
            padding: 8px 16px; cursor: pointer; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div style="margin-bottom: 5px;">MIMIC-TPW2: MID-ATLANTIC SECTOR</div>

    <div class="map-wrapper">
        <iframe id="mimic-frame" src="https://tropic.ssec.wisc.edu/real-time/mtpw2/product.php?color_type=tpw_nrl_colors&prod=conus&timespan=24hrs&anim=anigf"></iframe>
    </div>

    <div class="controls">
        <button onclick="update('24hrs')">24H</button>
        <button onclick="update('72hrs')">72H</button>
    </div>

    <script>
        function update(span) {
            const frame = document.getElementById('mimic-frame');
            frame.src = `https://tropic.ssec.wisc.edu/real-time/mtpw2/product.php?color_type=tpw_nrl_colors&prod=conus&timespan=${span}&anim=anigf`;
        }
    </script>
</body>
</html>
